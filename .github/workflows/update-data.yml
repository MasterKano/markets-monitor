name: Update market data

on:
  schedule:
    # UTC. Weekdays ~05:30 (pre-Europe open), ~12:30 (Nordic Power only: tomorrow's day-ahead prices
    # and the day's EEX settlements) and ~21:00 (after US close; markets + news only).
    # Weekends ~12:30: Nordic Power only (day-ahead auctions run every day).
    # Note: GitHub runs scheduled workflows only from the default branch.
    - cron: "30 5 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "30 12 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Market data (Yahoo)
        if: ${{ !startsWith(github.event.schedule, '30 12') }}
        run: python scripts/build_data.py
      - name: Company fundamentals (Yahoo, company panel)
        # ~1-2 min; morning + evening builds only (not the 12:30 power-only run)
        if: ${{ !startsWith(github.event.schedule, '30 12') }}
        run: python scripts/build_companies.py
        timeout-minutes: 8
        continue-on-error: true
      - name: News
        if: ${{ !startsWith(github.event.schedule, '30 12') }}
        run: python scripts/build_news.py
        continue-on-error: true
      - name: Nordic power (ENTSO-E, EEX CSV, day-ahead, hydro)
        # ENTSO-E is the primary day-ahead source (~1-2 min); Energy-Charts (~2 req/min) only fills failed zones.
        # Skipped at 21:00.
        if: github.event.schedule != '0 21 * * 1-5'
        run: python scripts/build_power.py
        env:
          # ENTSO-E Transparency: day-ahead prices, SE4 wind/load/flows/outages, reservoirs (skipped when unset)
          ENTSOE_API_TOKEN: ${{ secrets.ENTSOE_API_TOKEN }}
        timeout-minutes: 15
        continue-on-error: true
      - name: Symbol search index (Markets autofill)
        if: ${{ !startsWith(github.event.schedule, '30 12') }}
        run: python scripts/build_symbols.py
        continue-on-error: true
      - name: Commit data back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # only the files this run actually rewrote (steps can be skipped per schedule)
          changed=$(git status --porcelain -- data/market.json data/news.json data/power.json data/symbols.json data/companies.json | awk '{print $2}')
          if [ -z "$changed" ]; then echo "No data changes"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/out" && cp $changed "$RUNNER_TEMP/out/"
          for i in 1 2 3; do
            # rebuild the commit on top of the current branch tip (this run's files are the newest)
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            for f in $changed; do cp "$RUNNER_TEMP/out/$(basename "$f")" "$f"; done
            git add $changed
            if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
            git commit -q -m "Update market data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
