name: Intraday prices

# Market prices only (no fundamentals, power or news), every 15 min on weekdays.
# UTC 05:07-21:52 covers ~07:00-23:50 Geneva in summer (CEST) and ~06:00-22:50 in winter (CET).
# Off-quarter minutes: GitHub delays/drops many scheduled runs at :00/:15/:30/:45 under load.
# Nothing is committed to main: the result is force-pushed as a single-commit orphan branch `live-data`
# (no history growth). The page reads it from raw.githubusercontent.com and uses whichever of
# live-data/market.json and data/market.json (full builds, 05:30 / 21:00 UTC) is newer.
on:
  schedule:
    - cron: "7,22,37,52 5-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Intraday market data (Yahoo quotes)
        run: python scripts/build_data.py --intraday --sleep 0.1 --out "$RUNNER_TEMP/live/market.json"
        timeout-minutes: 4
      - name: Publish to orphan branch live-data (force-push, single commit)
        run: |
          cd "$RUNNER_TEMP/live"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -q -m "Intraday prices $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:live-data
        env:
          GH_TOKEN: ${{ github.token }}
