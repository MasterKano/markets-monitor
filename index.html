<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markets Monitor</title>
<style>
body{margin:0;background:#0b0f16;color:#e5e9f0;font-family:-apple-system,sans-serif}
header{padding:14px 16px 8px;border-bottom:1px solid #252d3c}
.kicker{color:#8b95a7;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
h1{margin:4px 0 0;font-size:22px}
.nav{display:none;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px}
.nav button{min-height:36px;padding:6px 12px;border:1px solid #364157;border-radius:6px;background:#0d131d;color:#e5e9f0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.panel{border:1px solid #252d3c;border-radius:10px;overflow:hidden;background:#111722}
.label{padding:8px 10px;color:#8b95a7;font-size:11px}
.chart{height:42vh;min-height:280px}
@media(max-width:760px){
 .grid{grid-template-columns:1fr;padding:8px 12px 16px}
 .nav{display:flex}
 .panel{display:none}
 .panel.on{display:block}
 .chart{height:64vh}
}
</style>
</head>
<body>
<header>
  <div class="kicker">Jezza's Dashboard</div>
  <h1>Markets Monitor</h1>
</header>
<div class="nav">
  <button id="prev" type="button">Prev</button>
  <strong id="title">Markets</strong>
  <button id="next" type="button">Next</button>
</div>
<div class="grid" id="grid"></div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const PANELS=[
  ['Markets','OANDA:SPX500USD'],
  ['Gold','OANDA:XAUUSD'],
  ['FX','OANDA:EURCHF'],
  ['US 10Y','TVC:US10Y']
];
let i=0;
const grid=document.getElementById('grid');
PANELS.forEach((p,n)=>{
  const box=document.createElement('section');
  box.className='panel'+(n===0?' on':'');
  box.id='p'+n;
  box.innerHTML='<div class="label">'+p[0]+'</div><div class="chart" id="c'+n+'"></div>';
  grid.appendChild(box);
});
function show(n){
  i=(n+PANELS.length)%PANELS.length;
  document.querySelectorAll('.panel').forEach((el,idx)=>el.classList.toggle('on',idx===i));
  document.getElementById('title').textContent=PANELS[i][0];
}
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
function boot(){
  if(!window.TradingView){setTimeout(boot,200);return;}
  PANELS.forEach((p,n)=>new TradingView.widget({
    autosize:true,symbol:p[1],interval:'D',timezone:'Europe/Zurich',theme:'dark',
    style:'1',locale:'en',hide_side_toolbar:true,allow_symbol_change:true,
    container_id:'c'+n,support_host:'https://www.tradingview.com'
  }));
}
boot();
</script>
</body>
</html>
