<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Markets Monitor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="app-header">
    <div>
      <span class="brand-kicker">Jezza's Dashboard</span>
      <h1>Markets Monitor</h1>
    </div>
    <div class="clocks">
      <div class="clock-block"><span class="clock-label">Geneva</span><time class="clock-value" id="genevaClock"></time></div>
      <div class="clock-block"><span class="clock-label">UTC</span><time class="clock-value" id="utcClock"></time></div>
    </div>
  </header>
  <div class="toolbar">
    <button class="button is-on" id="pageMonitor" type="button">Monitor</button>
    <button class="button" id="pageEquities" type="button">Equities</button>
    <label class="field" for="intervalSelect"><span class="field-label">Interval</span>
      <select id="intervalSelect">
        <option value="60">1 hour</option><option value="240">4 hour</option>
        <option value="D" selected>Daily</option><option value="W">Weekly</option><option value="M">Monthly</option>
      </select>
    </label>
    <label class="field" for="studiesSelect"><span class="field-label">Studies</span>
      <select id="studiesSelect">
        <option value="none">None</option><option value="ma" selected>50 / 100 / 200 MA</option>
        <option value="vol">Volume</option><option value="rsi">RSI 14</option>
        <option value="ma-vol">MA + Volume</option><option value="ma-rsi">MA + RSI</option>
      </select>
    </label>
    <button class="button layout-button" id="layoutButton" type="button">Stack view</button>
    <button class="button" id="addSymbolButton" type="button">Add symbol</button>
    <button class="button" id="themeButton" type="button">Light</button>
    <button class="button" id="refreshButton" type="button">Refresh</button>
    <button class="button" id="resetButton" type="button">Reset</button>
    <span class="toolbar-spacer"></span>
    <span class="connection" id="connectionStatus"><span class="connection-dot"></span><span id="connectionText">Browser online</span></span>
  </div>
  <div class="add-bar" id="addBar">
    <select id="addPanelSelect"></select>
    <input id="addNameInput" type="text" placeholder="Label">
    <input id="addSymbolInput" type="text" placeholder="EXCHANGE:SYMBOL" spellcheck="false">
    <button class="button is-on" id="addConfirmButton" type="button">Add</button>
  </div>
  <section class="page is-on" id="monitorPage">
    <div class="mobile-nav">
      <button class="button" id="prevPanelButton" type="button">Prev</button>
      <strong id="mobilePanelLabel">Markets</strong>
      <button class="button" id="nextPanelButton" type="button">Next</button>
    </div>
    <main class="dashboard" id="dashboard"></main>
  </section>
  <section class="page" id="equitiesPage">
    <div class="equity-wrap">
      <div class="search-box">
        <input id="equitySearch" type="search" placeholder="Search a stock" autocomplete="off" spellcheck="false">
        <div class="suggest" id="equitySuggest" hidden></div>
      </div>
      <div class="chips" id="equityChips"></div>
      <section class="equity-panel">
        <div class="panel-head">
          <div>
            <span class="panel-label">Equities</span>
            <strong class="panel-title" id="equityTitle">Apple</strong>
            <div class="panel-meta" id="equityMeta">NASDAQ:AAPL</div>
          </div>
        </div>
        <div class="chart-stage">
          <div class="chart" id="chart_equity"></div>
          <div class="chart-status" id="status_equity">Loading…</div>
        </div>
      </section>
    </div>
  </section>
  <footer>Bond yields blocked in widgets. Rates use ETFs. Equities search uses TV lookup when allowed.</footer>
</div>
<div class="sr-only" id="appStatus" role="status"></div>
<script src="app.js"></script>
</body>
</html>
