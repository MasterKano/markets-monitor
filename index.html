<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markets Monitor</title>
<style>body{margin:0;background:#0b0f16;color:#e5e9f0;font-family:-apple-system,sans-serif}header{padding:16px 20px;border-bottom:1px solid #252d3c}h1{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.chart{height:62vh}} .panel{border:1px solid #252d3c;border-radius:10px;overflow:hidden;background:#111722}.chart{height:420px}</style>
</head>
<body>
<header><div style="color:#8b95a7;font-size:10px;letter-spacing:1.5px;text-transform:uppercase">Jezza's Dashboard</div><h1>Markets Monitor</h1></header>
<div class="grid">
<div class="panel"><div class="chart" id="c1"></div></div>
<div class="panel"><div class="chart" id="c2"></div></div>
<div class="panel"><div class="chart" id="c3"></div></div>
<div class="panel"><div class="chart" id="c4"></div></div>
</div>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const charts=[
 ['c1','OANDA:SPX500USD'],
 ['c2','OANDA:XAUUSD'],
 ['c3','OANDA:EURCHF'],
 ['c4','TVC:US10Y']
];
function boot(){
 if(!window.TradingView){setTimeout(boot,200);return;}
 charts.forEach(([id,symbol])=>new TradingView.widget({
  autosize:true,symbol,interval:'D',timezone:'Europe/Zurich',theme:'dark',
  style:'1',locale:'en',hide_side_toolbar:true,allow_symbol_change:true,
  container_id:id,support_host:'https://www.tradingview.com'
 }));
}
boot();
</script>
</body>
</html>
